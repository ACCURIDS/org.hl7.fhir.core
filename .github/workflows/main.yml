name: CVE Dependency Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install OWASP Dependency-Check
        run: |
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.1.0/dependency-check-9.1.0-release.zip
          unzip -q dependency-check-9.1.0-release.zip
          DCDIR=$(find . -maxdepth 1 -type d -name "dependency-check*" | head -n 1)
          chmod +x "$DCDIR/bin/dependency-check.sh"
          echo "$DCDIR/bin" >> $GITHUB_PATH

      - name: Run Dependency-Check with Retry Logic
        run: |
          mkdir -p reports
          echo ${{ secrets.NVD_API_KEY }}
          # First try with API delay
          dependency-check.sh \
            --project "FHIR CORE" \
            --scan . \
            --format "ALL" \
            --out reports \
            --nvdApiKey "$NVD_API_KEY" \
            --nvdApiDelay 5000 || \
            
          # Fallback to local cache if API fails
          dependency-check.sh \
            --project "FHIR CORE" \
            --scan . \
            --format "ALL" \
            --out reports \
            --disableNVD true \
            --enableExperimental
