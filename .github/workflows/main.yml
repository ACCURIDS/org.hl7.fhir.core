name: Dependency Check

on:
  push:
    branches:
      - 5.1.0-patch1
  pull_request:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      # Always use latest checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup latest stable JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Run OWASP Dependency-Check with Maven
      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      # Upload HTML report as artifact
      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          
      # Deploy Dependency Report to GitHub Pages
      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          publish_dir: ./target
          publish_branch: gh-pages
          
      - name: Send Email with Report Link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dependency Check Report - ${{ github.repository }}"
          to: yacinbnsalh@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hello,

            The latest dependency check report is available at the following link:
            https://yassinbnsalah.github.io/org.hl7.fhir.core/dependency-check-report.html

            Regards,
            GitHub Actions
