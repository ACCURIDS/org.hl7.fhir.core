name: CVE Dependency Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}  # ✅ PROPER SECURE WAY

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install OWASP Dependency-Check
        run: |
          wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.1.0/dependency-check-9.1.0-release.zip
          unzip -q dependency-check-9.1.0-release.zip
          DCDIR=$(find . -maxdepth 1 -type d -name "dependency-check*" | head -n 1)
          chmod +x "$DCDIR/bin/dependency-check.sh"

      - name: Run Scan
        run: |
          DCDIR=$(find . -maxdepth 1 -type d -name "dependency-check*" | head -n 1)
          mkdir -p reports
          "$DCDIR/bin/dependency-check.sh" \
            --project "My Project" \
            --scan . \
            --format "ALL" \
            --out reports \
            --nvdApiKey "$NVD_API_KEY"  # 🔒 Uses secret securely
