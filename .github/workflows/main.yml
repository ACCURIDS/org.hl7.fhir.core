name: Dependency Check

on:
  push:
    branches:
      - 5.1.0-patch1
  pull_request:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      # Always use latest checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup latest stable JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Run OWASP Dependency-Check with Maven
      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      # Upload HTML report as artifact
      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          

      # Read the HTML report into an environment variable
      - name: Read Dependency Report
        id: report
        run: |
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat target/dependency-check-report.html >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Send the report inline in the email
      - name: Send Email with Report Inline
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dependency Check Report - ${{ github.repository }}"
          to: yacinbnsalh@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          html_body: ${{ env.REPORT }}
