name: Dependency Check

on:
  push:
    branches: [ 5.1.0-patch1 ]
  pull_request:
    branches: [ 5.1.0-patch1 ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'org.hl7.fhir.core'
        format: 'ALL'
        additional_arguments: '--scan **/* --out ./reports'

    - name: Upload report artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-check-report
        path: reports/
        
    - name: Display summary
      run: |
        if [ -f reports/dependency-check-report.html ]; then
          echo "Dependency Check report generated"
          echo "High vulnerabilities found: $(grep -o 'High<\/td><td>[0-9]*' reports/dependency-check-report.html | grep -o '[0-9]*$' || echo 0)"
          echo "Medium vulnerabilities found: $(grep -o 'Medium<\/td><td>[0-9]*' reports/dependency-check-report.html | grep -o '[0-9]*$' || echo 0)"
        else
          echo "No dependency check report generated"
          exit 1
        fi
