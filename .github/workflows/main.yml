name: CVE Dependency Scan

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 03:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install OWASP Dependency-Check
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.1.0/dependency-check-9.1.0-release.zip
          unzip dependency-check-9.1.0-release.zip
          mv dependency-check-9.1.0 dependency-check
          chmod +x dependency-check/bin/dependency-check.sh

      - name: Run OWASP Dependency-Check
        run: |
          dependency-check/bin/dependency-check.sh \
            --project "FHIR Security Scan" \
            --scan . \
            --format "ALL" \
            --out reports
          echo "=== CVE Scan Summary ==="
          cat reports/dependency-check-report.txt || true

      - name: Upload scan report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: reports
