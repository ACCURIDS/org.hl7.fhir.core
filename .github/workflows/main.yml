name: Dependency Check

on:
  push:
    branches:
      - 5.1.0-patch1
  pull_request:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      # Always use latest checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup latest stable JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Run OWASP Dependency-Check with Maven
      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check -DnvdApiKey=${{ secrets.NVD_API_KEY }} -Dformat=ALL
      # Upload HTML report as artifact
      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          
      

      # Read report into an environment variable safely
      - name: Extract CVE Summary
        id: summary
        run: |
          TOTAL=$(jq '.dependencies | length' target/dependency-check-report.json)
          VULN=$(jq '[.dependencies[] | select(.vulnerabilities != null)] | length' target/dependency-check-report.json)
          
          # Extract top 3 critical CVEs (example)
          echo "CRITICAL_CVES=$(jq -r '[.dependencies[] | select(.vulnerabilities != null) | . as $dep | .vulnerabilities[] | select(.severity == "HIGH" or .severity == "CRITICAL") | {dependency: $dep.fileName, version: $dep.version, cve: .name, severity: .severity}] | .[0:3] | map("\(.dependency)@\(.version) (\(.severity)) - CVE: \(.cve)") | join("\n")' target/dependency-check-report.json)" >> $GITHUB_ENV
          
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo "VULN=$VULN" >> $GITHUB_ENV

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 Dependency Check Report - ${{ github.repository }}"
          to: yacinbnsalh@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hi Team,

            Here's the latest dependency security scan report for **${{ github.repository }}**:

            📅 **Scan Date**: $(date +'%Y-%m-%d %H:%M')
            📦 **Total Dependencies**: ${{ env.TOTAL }}
            ⚠️ **Vulnerable Dependencies**: ${{ env.VULN }}

            🔥 **Critical Vulnerabilities**:
            ${{ env.CRITICAL_CVES }}

            📌 **Recommended Actions**:
            1. Update vulnerable dependencies immediately.
            2. Review the full report (attached) for details.
            3. Check for patches in the next 48 hours.

            🔗 **Full Report**: See attached HTML file.

            Regards,
            Your Security Automation Bot
          attachments: target/dependency-check-report.html
