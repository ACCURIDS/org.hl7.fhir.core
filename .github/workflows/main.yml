name: Dependency Check

on:
  push:
    branches:
      - 5.1.0-patch1
  pull_request:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Run OWASP Dependency-Check (Maven example)
      - name: Run OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check

      # Upload report as artifact
      - name: Upload Dependency Report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      # Send report by email
      - name: Send Email with Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dependency Check Report - ${{ github.repository }}"
          to: yacinbnsalh@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hello,
            
            Please find attached the latest dependency check report for the project: ${{ github.repository }}.
            
            Regards,  
            GitHub Actions
          attachments: target/dependency-check-report.html
